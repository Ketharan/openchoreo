---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: approvalrequests.openchoreo.dev
spec:
  group: openchoreo.dev
  names:
    kind: ApprovalRequest
    listKind: ApprovalRequestList
    plural: approvalrequests
    shortNames:
    - apreq
    - apreqs
    singular: approvalrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .spec.target.environment
      name: Environment
      type: string
    - jsonPath: .spec.requester.displayName
      name: Requester
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApprovalRequest is the Schema for the approvalrequests API.
          It represents one pending human decision about one specific change.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ApprovalRequestSpec defines the desired state of ApprovalRequest.

              Every field except Decision is immutable: an approver must not be able to
              review one change while a different one executes.
            properties:
              action:
                description: |-
                  Action is the gated action, copied from the policy at creation so the
                  request stays meaningful if the policy later changes.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.action is immutable
                  rule: self == oldSelf
              decision:
                description: |-
                  Decision records the approver's answer. Absent while pending, set once by
                  the API on behalf of an authenticated approver, and immutable thereafter.

                  It is intent rather than observation, so it lives in spec. The consequence
                  is that a subject with direct write access to the CR could forge one, which
                  under an API-layer gate is the same population that can bypass the gate
                  outright.
                properties:
                  comment:
                    description: |-
                      Comment explains the decision. Required on rejection: a rejection with no
                      reason is the worst outcome for the requester.
                    maxLength: 2048
                    type: string
                  decidedAt:
                    description: DecidedAt is when the decision was made.
                    format: date-time
                    type: string
                  decidedBy:
                    description: DecidedBy is the approving subject.
                    properties:
                      displayName:
                        description: DisplayName is a human-readable name captured
                          when the subject acted.
                        type: string
                      id:
                        description: ID is the stable subject identifier, from the
                          token's `sub` claim.
                        minLength: 1
                        type: string
                    required:
                    - id
                    type: object
                  result:
                    description: Result is the answer.
                    enum:
                    - Approved
                    - Rejected
                    type: string
                required:
                - decidedAt
                - decidedBy
                - result
                type: object
                x-kubernetes-validations:
                - message: spec.decision is immutable once set
                  rule: '!has(oldSelf) || self == oldSelf'
                - message: a rejection requires a comment
                  rule: self.result != 'Rejected' || (has(self.comment) && size(self.comment)
                    > 0)
              message:
                description: |-
                  Message is the requester's justification, and the single largest lever on
                  how quickly a request is decided.
                maxLength: 2048
                type: string
              policyName:
                description: PolicyName is the ApprovalPolicy that gated the action,
                  in this namespace.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.policyName is immutable
                  rule: self == oldSelf
              requestedState:
                description: |-
                  RequestedState is the complete intent being approved. For a promotion this
                  is the whole desired binding spec, not just the release name: binding an
                  approval to the release name alone would let environment configs or
                  workload overrides change between review and execution.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              requester:
                description: Requester is the subject that opened the request.
                properties:
                  displayName:
                    description: DisplayName is a human-readable name captured when
                      the subject acted.
                    type: string
                  id:
                    description: ID is the stable subject identifier, from the token's
                      `sub` claim.
                    minLength: 1
                    type: string
                required:
                - id
                type: object
                x-kubernetes-validations:
                - message: spec.requester is immutable
                  rule: self == oldSelf
              stateFingerprint:
                description: |-
                  StateFingerprint is a digest of RequestedState, computed at creation. The
                  action is only permitted to proceed when the state being applied hashes to
                  this value, which is what stops an approval being reused for a different
                  change.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.stateFingerprint is immutable
                  rule: self == oldSelf
              summary:
                description: Summary is the rendered evidence shown to an approver.
                properties:
                  changeKind:
                    description: ChangeKind classifies the change.
                    enum:
                    - ReleaseChange
                    - ConfigChange
                    - Undeploy
                    type: string
                  current:
                    description: Current describes what is running now.
                    type: string
                  details:
                    description: |-
                      Details holds rendered lines describing the difference. Without these an
                      approver is deciding on a version string alone.
                    items:
                      type: string
                    type: array
                  requested:
                    description: Requested describes what would run.
                    type: string
                type: object
              target:
                description: Target identifies the object the action would act upon.
                properties:
                  component:
                    description: Component owning the target.
                    type: string
                  environment:
                    description: |-
                      Environment the action targets. Drives approver matching, and is the field
                      operators filter on.
                    type: string
                  kind:
                    description: Kind of the target object, e.g. "ReleaseBinding".
                    minLength: 1
                    type: string
                  name:
                    description: Name of the target object.
                    minLength: 1
                    type: string
                  project:
                    description: Project owning the target.
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.target is immutable
                  rule: self == oldSelf
              ttlAfterCompletion:
                description: |-
                  TTLAfterCompletion is how long this request is retained after reaching a
                  terminal phase. Copied from the policy at creation.
                pattern: ^(\d+d)?(\d+h)?(\d+m)?(\d+s)?$
                type: string
            required:
            - action
            - policyName
            - requestedState
            - requester
            - stateFingerprint
            - target
            type: object
          status:
            description: ApprovalRequestStatus defines the observed state of ApprovalRequest.
            properties:
              completedAt:
                description: |-
                  CompletedAt is when the request reached a terminal phase, used with
                  TTLAfterCompletion to decide when to delete it.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle position.
                enum:
                - Pending
                - Approved
                - Rejected
                - Cancelled
                - Executed
                - Failed
                type: string
              staleReason:
                description: |-
                  StaleReason is set when a pending request can no longer be fulfilled as
                  written, such as the requested release having been deleted or superseded.
                  Surfaced rather than auto-resolved: the approver reviewed a specific
                  artifact, so the request is never silently retargeted.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
