---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: approvalpolicies.openchoreo.dev
spec:
  group: openchoreo.dev
  names:
    kind: ApprovalPolicy
    listKind: ApprovalPolicyList
    plural: approvalpolicies
    shortNames:
    - appol
    - appols
    singular: approvalpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.scope.environment
      name: Environment
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApprovalPolicy is the Schema for the approvalpolicies API.
          It declares that an action, within a scope, requires a human decision.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApprovalPolicySpec defines the desired state of ApprovalPolicy.
            properties:
              action:
                description: |-
                  Action is the action this policy gates, e.g. "releasebinding:update".
                  Validated against the registry of approval-capable actions: gating an action
                  with no enforcement point would produce a policy that silently never fires.
                minLength: 1
                type: string
              allowSelfApproval:
                default: false
                description: AllowSelfApproval permits the requester to approve their
                  own request.
                type: boolean
              approvers:
                description: Approvers lists who may decide. Any one of them is sufficient.
                items:
                  description: |-
                    ApproverRef identifies who may decide. Exactly one of RoleRef or Entitlement
                    must be set: a role grants approval authority to whoever holds it, while an
                    entitlement names a subject directly.

                    A claim-matched subject cannot be enumerated. The platform can test whether a
                    caller matches, but cannot list who matches, so a named individual is the only
                    form that lets a requester see who to ask.
                  properties:
                    entitlement:
                      description: |-
                        Entitlement names a subject by JWT claim, e.g.
                        {claim: email, value: someone@example.com} for a person, or
                        {claim: groups, value: sre-leads} for a group.
                      properties:
                        claim:
                          description: Claim is the JWT claim name (e.g., "groups",
                            "sub", "email")
                          type: string
                        value:
                          description: Value is the entitlement value to match
                          type: string
                      required:
                      - claim
                      - value
                      type: object
                    roleRef:
                      description: RoleRef grants approval authority to holders of
                        an AuthzRole or ClusterAuthzRole.
                      properties:
                        kind:
                          description: |-
                            Kind is the kind of role (AuthzRole or ClusterAuthzRole)
                            For AuthzRoleBinding: AuthzRole must be in the same namespace
                          enum:
                          - AuthzRole
                          - ClusterAuthzRole
                          type: string
                        name:
                          description: Name is the name of the role
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    scope:
                      description: |-
                        Scope bounds where a role-based approver's authority applies. Ignored when
                        Entitlement is set. Omitted means the policy's own scope.
                      properties:
                        component:
                          description: Component scopes to a specific component (optional)
                          type: string
                        project:
                          description: Project scopes to a specific project (optional)
                          type: string
                        resource:
                          description: Resource scopes to a specific resource (optional)
                          type: string
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of roleRef or entitlement must be set
                    rule: has(self.roleRef) != has(self.entitlement)
                minItems: 1
                type: array
              changes:
                description: Changes selects which kinds of change are gated. Omitted
                  gates every kind.
                items:
                  description: |-
                    ChangeKind classifies a change to a gated target. A policy that lists no
                    change kinds gates every kind, which is the safe default: a policy written
                    only against ReleaseChange would leave undeploy and config-only edits
                    ungated, and either can take an environment down as surely as a bad release.
                  enum:
                  - ReleaseChange
                  - ConfigChange
                  - Undeploy
                  type: string
                minItems: 1
                type: array
              requestTTLAfterCompletion:
                default: 30d
                description: |-
                  RequestTTLAfterCompletion is how long decided requests from this policy are
                  retained before deletion. Pending requests are never auto-deleted.
                  Format matches WorkflowRun: "90d", "1h30m", "30m".
                pattern: ^(\d+d)?(\d+h)?(\d+m)?(\d+s)?$
                type: string
              scope:
                description: |-
                  Scope narrows the policy to part of the hierarchy. An empty scope gates the
                  action everywhere in the namespace.
                properties:
                  component:
                    description: Component scopes the policy to a single component.
                      Requires Project.
                    type: string
                  environment:
                    description: Environment scopes the policy to the environment
                      being acted upon.
                    type: string
                  fromEnvironment:
                    description: |-
                      FromEnvironment further narrows to promotions originating in a specific
                      environment, so "staging to production" can be permitted while
                      "dev to production" is gated.
                    type: string
                  project:
                    description: Project scopes the policy to a single project.
                    type: string
                type: object
              suspend:
                default: false
                description: |-
                  Suspend stops the policy gating anything without deleting it, so a policy's
                  history survives an incident. Pending requests are unaffected.
                type: boolean
            required:
            - action
            - approvers
            type: object
          status:
            description: ApprovalPolicyStatus defines the observed state of ApprovalPolicy.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the policy.
                  Surfaced here rather than left for a developer to discover mid-incident:
                  ActionNotGatable, RoleNotFound, ApproversUnresolvable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
